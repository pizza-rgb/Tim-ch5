<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>บทที่ 5 — Regression Quiz 40 ข้อ</title>
<style>
:root{--navy:#173b73;--blue:#2878b9;--light:#f4f7fb;--green:#198754;--red:#dc3545;--gold:#d79b00;--text:#172033}
*{box-sizing:border-box} body{margin:0;background:var(--light);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans Thai",Arial,sans-serif;color:var(--text)}
header{background:linear-gradient(135deg,#173b73,#245899);color:white;padding:28px 18px;text-align:center}
header h1{margin:0 0 8px;font-size:clamp(23px,5vw,34px)} header p{margin:0;opacity:.9}
.wrap{max-width:900px;margin:20px auto;padding:0 14px}
.topbar{position:sticky;top:0;z-index:5;background:white;border-radius:14px;box-shadow:0 3px 14px #0001;padding:12px;margin-bottom:16px}
.progress{height:9px;background:#e7ebf2;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:var(--blue);width:0%;transition:.25s}
.status{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-bottom:8px}
.card{background:white;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 2px 12px #0000000c;border:1px solid #e5e9f0}
.badge{display:inline-block;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;margin-bottom:10px}
.memory{background:#e8f2ff;color:#1767a8}.analysis{background:#fff2d9;color:#946200}
.q{font-size:18px;line-height:1.6;font-weight:700;margin:0 0 14px}
.option{display:block;border:1.5px solid #dce2eb;border-radius:12px;padding:12px 13px;margin:9px 0;cursor:pointer;transition:.15s;background:#fff}
.option:hover{border-color:#8bb7dc;background:#f8fbff}.option input{margin-right:10px;transform:scale(1.1)}
.correct{border-color:var(--green)!important;background:#eaf8f0!important}.wrong{border-color:var(--red)!important;background:#fff0f1!important}
.feedback{display:none;margin-top:14px;padding:13px 14px;border-radius:12px;line-height:1.6}.feedback.show{display:block}.feedback.ok{background:#eaf8f0;color:#135d39}.feedback.no{background:#fff0f1;color:#8b1e29}
.feedback b{display:block;margin-bottom:4px}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:20px 0 40px}
button{border:0;border-radius:12px;padding:12px 18px;font-size:15px;font-weight:700;cursor:pointer}
#submit{background:var(--navy);color:white}#reset{background:#e7ebf2;color:#26364d}
.result{display:none;background:white;border-radius:18px;padding:22px;margin:18px 0;box-shadow:0 3px 16px #0001;text-align:center}.result.show{display:block}
.score{font-size:38px;font-weight:800;color:var(--navy)}.small{font-size:13px;color:#667085}
.nav{display:flex;justify-content:space-between;gap:8px;margin-top:10px}.nav button{background:#eef3f9;color:#173b73}
.locked{opacity:.7}
@media(max-width:600px){.card{padding:16px}.q{font-size:16px}.option{font-size:14px}}
</style>
</head>
<body>
<header>
<h1>บทที่ 5: Regression & Correlation</h1>
<p>ข้อสอบ 40 ข้อ — จำ 20 ข้อ + วิเคราะห์/คำนวณ 20 ข้อ</p>
</header>
<div class="wrap">
<div class="topbar">
  <div class="status"><span id="answered">ตอบแล้ว 0/40</span><span id="saveStatus">บันทึกอัตโนมัติ</span></div>
  <div class="progress"><div id="bar"></div></div>
</div>
<div id="result" class="result"></div>
<form id="quiz"></form>
<div class="controls">
  <button type="button" id="submit">ส่งคำตอบและตรวจคะแนน</button>
  <button type="button" id="reset">เริ่มใหม่/ล้างคำตอบ</button>
</div>
<p class="small" style="text-align:center">ระบบจะบันทึกคำตอบอัตโนมัติในเครื่องนี้ และกู้คืนเมื่อเปิดหน้าเดิมอีกครั้ง</p>
</div>
<script>
const questions = [{"id": 1, "type": "จำ", "q": "ในการวิเคราะห์ความถดถอย ตัวแปรใดใช้สัญลักษณ์ X ตามบทนี้?", "opts": ["ตัวแปรตาม (Dependent Variable)", "ตัวแปรอิสระ (Independent Variable)", "ค่าความคลาดเคลื่อน", "ค่าสัมประสิทธิ์สหสัมพันธ์"], "ans": 1, "exp": "X คือ ตัวแปรอิสระ (Independent Variable) ใช้เป็นข้อมูลตั้งต้นในการพยากรณ์ Y ส่วน Y เป็นตัวแปรตามที่ต้องการอธิบายหรือพยากรณ์"}, {"id": 2, "type": "จำ", "q": "ข้อใดอธิบายความแตกต่างระหว่าง Regression กับ Correlation ได้ถูกต้องที่สุด?", "opts": ["Correlation ใช้พยากรณ์ Y แต่ Regression ใช้ไม่ได้", "Regression ใช้เฉพาะตัวแปรเดียว", "Correlation เน้นระดับ/ทิศทางความสัมพันธ์ ส่วน Regression สามารถใช้สร้างสมการเพื่อพยากรณ์ได้", "ทั้งสองอย่างเหมือนกันทุกประการ"], "ans": 2, "exp": "บทกำหนดว่า Correlation เน้นศึกษาขนาดและทิศทางของความสัมพันธ์ ส่วน Regression สามารถนำความสัมพันธ์มาสร้างสมการเพื่อพยากรณ์ได้"}, {"id": 3, "type": "จำ", "q": "สมการถดถอยเชิงเส้นอย่างง่ายที่ใช้พยากรณ์จากข้อมูลตัวอย่างคือข้อใด?", "opts": ["Ŷ = a + bX", "Ŷ = ab + X", "Ŷ = X/a + b", "Ŷ = aX + bX²"], "ans": 0, "exp": "สมการที่ใช้ในบทคือ Ŷ = a + bX โดย a คือค่าประมาณของจุดตัดแกน และ b คือค่าประมาณของความชัน"}, {"id": 4, "type": "จำ", "q": "ในสมการ Ŷ = a + bX ค่า a หมายถึงอะไร?", "opts": ["ความชันของเส้นถดถอย", "ค่า Y ที่พยากรณ์เมื่อ X = 0", "ค่าความคลาดเคลื่อนเฉลี่ย", "ค่าสัมประสิทธิ์สหสัมพันธ์"], "ans": 1, "exp": "a คือจุดตัดแกน Y หรือค่าของ Y เมื่อ X มีค่าเป็น 0"}, {"id": 5, "type": "จำ", "q": "ในสมการ Ŷ = a + bX ค่า b หมายถึงอะไร?", "opts": ["ค่า Y เมื่อ X = 0", "จำนวนตัวอย่าง", "ความชัน/สัมประสิทธิ์ความถดถอย ซึ่งบอกการเปลี่ยนแปลงของ Y เมื่อ X เปลี่ยน 1 หน่วย", "ค่า SSE"], "ans": 2, "exp": "b คือ Slope หรือ Regression Coefficient แปลว่าเมื่อ X เปลี่ยน 1 หน่วย Y จะเปลี่ยนโดยเฉลี่ย b หน่วย"}, {"id": 6, "type": "จำ", "q": "ถ้า b > 0 ในสมการถดถอยเชิงเส้นอย่างง่าย หมายถึงอะไร?", "opts": ["X และ Y มีแนวโน้มเปลี่ยนไปในทิศทางเดียวกัน", "X และ Y เปลี่ยนสวนทางกัน", "X และ Y ไม่มีความสัมพันธ์เชิงเส้น", "Y ต้องมีค่าเป็นบวกเสมอ"], "ans": 0, "exp": "b > 0 หมายถึงความสัมพันธ์เชิงเส้นเป็นทิศทางเดียวกัน: X เพิ่ม Y มีแนวโน้มเพิ่ม และ X ลด Y มีแนวโน้มลด"}, {"id": 7, "type": "จำ", "q": "ถ้า b < 0 หมายถึงอะไร?", "opts": ["X เพิ่มแล้ว Y มีแนวโน้มเพิ่ม", "X เพิ่มแล้ว Y มีแนวโน้มลด", "ไม่มีความสัมพันธ์ทุกกรณี", "Y มีค่าเป็นศูนย์"], "ans": 1, "exp": "b < 0 หมายถึงความสัมพันธ์เชิงเส้นในทิศทางตรงข้าม: X เพิ่ม Y มีแนวโน้มลด"}, {"id": 8, "type": "จำ", "q": "วิธีกำลังสองน้อยที่สุด (Least Squares) มีเป้าหมายหลักอะไร?", "opts": ["ทำให้ผลรวมของ X เป็นศูนย์", "ทำให้ SSE หรือผลรวมกำลังสองของความคลาดเคลื่อนต่ำที่สุด", "ทำให้ b เป็น 1 เสมอ", "ทำให้ r เป็น 1 เสมอ"], "ans": 1, "exp": "Least Squares เลือก a และ b ที่ทำให้ Σ(Y−Ŷ)² หรือ SSE มีค่าต่ำที่สุด"}, {"id": 9, "type": "จำ", "q": "ข้อใดคือความคลาดเคลื่อน (error/residual) ตามสมการในบท?", "opts": ["e = Ŷ − Y", "e = Y − Ŷ", "e = X − Y", "e = a − b"], "ans": 1, "exp": "ความคลาดเคลื่อนในตัวอย่างเขียนเป็น e = Y − Ŷ คือค่าจริงลบค่าที่พยากรณ์ได้"}, {"id": 10, "type": "จำ", "q": "SSE ย่อมาจากอะไร?", "opts": ["Sum Square of Error", "Simple Slope Estimate", "Sum Sample Effect", "Standard Square Error"], "ans": 0, "exp": "SSE คือ Sum Square of Error หรือผลรวมกำลังสองของความคลาดเคลื่อน: Σ(Y−Ŷ)²"}, {"id": 11, "type": "จำ", "q": "สมมติฐาน H0 สำหรับการทดสอบ β1 แบบสองด้านในบทคือข้อใด?", "opts": ["H0: β1 = 0", "H0: β1 > 0", "H0: β1 < 0", "H0: β1 ≠ 0"], "ans": 0, "exp": "การทดสอบสองด้านตั้ง H0: β1 = 0 และ H1: β1 ≠ 0 เพื่อทดสอบว่าความสัมพันธ์เชิงเส้นมีหรือไม่"}, {"id": 12, "type": "จำ", "q": "ถ้าทดสอบ β1 แบบด้านเดียวเพื่อพิสูจน์ว่า X และ Y สัมพันธ์กันทางเดียวกัน ควรใช้สมมติฐานใด?", "opts": ["H0: β1 ≥ 0, H1: β1 < 0", "H0: β1 ≤ 0, H1: β1 > 0", "H0: β1 = 0, H1: β1 ≠ 0", "H0: β1 > 0, H1: β1 ≤ 0"], "ans": 1, "exp": "ถ้าต้องการพิสูจน์ความสัมพันธ์ทางบวก ใช้ H0: β1 ≤ 0 และ H1: β1 > 0 ตามตัวอย่างในสไลด์"}, {"id": 13, "type": "จำ", "q": "ถ้า p-value < .05 ตามเกณฑ์ในบท ควรตัดสินใจอย่างไร?", "opts": ["ยอมรับ H0", "ปฏิเสธ H0 และสรุปว่า X มีนัยสำคัญในการพยากรณ์ Y", "ไม่สามารถสรุปอะไรได้", "ต้องเปลี่ยนเป็น Correlation ทันที"], "ans": 1, "exp": "บทกำหนดระดับนัยสำคัญ .05 ถ้า p < .05 ให้ปฏิเสธ H0 และสรุปว่า X มีนัยสำคัญ"}, {"id": 14, "type": "จำ", "q": "ถ้า p-value ≥ .05 ตามบท ควรสรุปอย่างไร?", "opts": ["ปฏิเสธ H0 แน่นอน", "X พยากรณ์ Y ได้อย่างมีนัยสำคัญ", "ไม่ปฏิเสธ/ยอมรับ H0 และยังไม่มีหลักฐานเพียงพอว่า X พยากรณ์ Y ได้", "r ต้องเท่ากับ 1"], "ans": 2, "exp": "เมื่อ p ≥ .05 บทให้ยอมรับ H0 ในการสรุปแบบที่สไลด์ใช้ และกล่าวว่ายังไม่มีหลักฐานว่า X พยากรณ์ Y ได้"}, {"id": 15, "type": "จำ", "q": "ในการทดสอบประสิทธิภาพของสมการด้วย ANOVA ค่า F คำนวณจากข้อใด?", "opts": ["F = MSE/MSR", "F = MSR/MSE", "F = SSE/SST", "F = r²/r"], "ans": 1, "exp": "สไลด์กำหนด F = MSR/MSE"}, {"id": 16, "type": "จำ", "q": "SST, SSR และ SSE มีความสัมพันธ์กันอย่างไรในบท?", "opts": ["SST = SSR − SSE", "SSE = SST + SSR", "SST = SSR + SSE", "SSR = SST + SSE"], "ans": 2, "exp": "ความแปรปรวนรวม SST แบ่งเป็นส่วนที่อธิบายด้วย Regression (SSR) และส่วนความคลาดเคลื่อน (SSE): SST = SSR + SSE"}, {"id": 17, "type": "จำ", "q": "ค่าสัมประสิทธิ์สหสัมพันธ์ r มีช่วงค่าใด?", "opts": ["0 ถึง 1 เท่านั้น", "−1 ถึง 1", "−100 ถึง 100", "ค่าบวกเท่านั้น"], "ans": 1, "exp": "r มีค่าอยู่ระหว่าง −1 ถึง 1"}, {"id": 18, "type": "จำ", "q": "ถ้า r เข้าใกล้ −1 หมายถึงอะไร?", "opts": ["สัมพันธ์ทางเดียวกันมาก", "สัมพันธ์ตรงข้ามกันมาก", "ไม่มีความสัมพันธ์", "X และ Y เท่ากัน"], "ans": 1, "exp": "r ใกล้ −1 หมายถึง X และ Y มีความสัมพันธ์ในทิศทางตรงข้ามและมีความสัมพันธ์กันมาก"}, {"id": 19, "type": "จำ", "q": "ค่าสัมประสิทธิ์การตัดสินใจ (Coefficient of Determination) เท่ากับอะไร?", "opts": ["r", "r²", "1/r", "√r"], "ans": 1, "exp": "Coefficient of Determination = r² ใช้บอกสัดส่วนความแปรปรวนของ Y ที่อธิบายได้ด้วย X"}, {"id": 20, "type": "จำ", "q": "ข้อใดเป็นสมมติฐานของ error ใน Regression ตามบท?", "opts": ["มีค่าเฉลี่ย 0 และแจกแจงปกติ โดยมีความแปรปรวน σ²", "ต้องมีค่าเฉลี่ย 1 เสมอ", "ต้องเป็นบวกทุกตัว", "ต้องเท่ากับ X"], "ans": 0, "exp": "บทกำหนด error มีค่าเฉลี่ย 0 ความแปรปรวน σ² เป็นอิสระกัน และมีการแจกแจงปกติ Normal(0,σ²)"}, {"id": 21, "type": "วิเคราะห์", "q": "ร้านหนึ่งสร้างสมการพยากรณ์ยอดขายได้ Ŷ = 20 + 3X โดย X คือจำนวนชั่วโมงอบรมพนักงาน ถ้าเพิ่มชั่วโมงอบรมจาก 5 เป็น 6 ชั่วโมง ยอดขายที่พยากรณ์จะเปลี่ยนอย่างไร?", "opts": ["เพิ่ม 3 หน่วย", "เพิ่ม 6 หน่วย", "เพิ่ม 18 หน่วย", "ไม่เปลี่ยน"], "ans": 0, "exp": "b = 3 จึงหมายความว่า X เพิ่ม 1 หน่วย Y จะเพิ่ม 3 หน่วย การเปลี่ยนจาก 5 เป็น 6 คือ +1 หน่วย จึงเพิ่ม 3 หน่วย"}, {"id": 22, "type": "วิเคราะห์", "q": "สมการคือ Ŷ = 50 − 2X ถ้า X เพิ่มขึ้น 4 หน่วย ค่าพยากรณ์ Y จะเปลี่ยนไปเท่าไร?", "opts": ["เพิ่ม 8", "ลด 8", "ลด 2", "เพิ่ม 2"], "ans": 1, "exp": "b = −2 ดังนั้น X เพิ่ม 4 หน่วย → Y เปลี่ยน −2×4 = −8 หรือ ลดลง 8 หน่วย"}, {"id": 23, "type": "วิเคราะห์", "q": "กำหนดสมการ Ŷ = 10 + 4X ถ้า X = 7 ค่าพยากรณ์ Y เท่ากับเท่าไร?", "opts": ["28", "38", "42", "70"], "ans": 1, "exp": "แทน X = 7: Ŷ = 10 + 4(7) = 10 + 28 = 38"}, {"id": 24, "type": "วิเคราะห์", "q": "จากสมการ Ŷ = −0.1 + 0.7X ถ้าเงินเดือน X = 6 หน่วย ค่ารายจ่าย Y ที่พยากรณ์ได้เท่าไร?", "opts": ["3.5", "4.1", "4.2", "4.9"], "ans": 1, "exp": "Ŷ = −0.1 + 0.7(6) = −0.1 + 4.2 = 4.1 หน่วย"}, {"id": 25, "type": "วิเคราะห์", "q": "จากข้อมูล X = 1,2,3,4,5 และ Y = 1,1,2,2,4 ให้ ΣX=15, ΣY=10, ΣX²=55, ΣXY=37 และ n=5 ค่า b เท่ากับเท่าไร?", "opts": ["0.5", "0.7", "1.0", "1.4"], "ans": 1, "exp": "SSXX = 55 − 15²/5 = 10 และ SSXY = 37 − (15×10)/5 = 7 ดังนั้น b = SSXY/SSXX = 7/10 = 0.7"}, {"id": 26, "type": "วิเคราะห์", "q": "จากข้อมูลข้อ 25 ค่า a ในสมการ Ŷ = a + bX เท่ากับเท่าไร?", "opts": ["−0.7", "−0.1", "0.1", "0.7"], "ans": 1, "exp": "จากข้อ 25 b = 0.7, X̄ = 15/5 = 3 และ Ȳ = 10/5 = 2 ดังนั้น a = Ȳ − bX̄ = 2 − 0.7(3) = −0.1"}, {"id": 27, "type": "วิเคราะห์", "q": "จากข้อมูลข้อ 25 เมื่อได้สมการ Ŷ = −0.1 + 0.7X หาก X เพิ่มจาก 3 เป็น 5 หน่วย ค่าพยากรณ์ Y จะเพิ่มขึ้นเท่าไร?", "opts": ["0.7 หน่วย", "1.4 หน่วย", "2.0 หน่วย", "3.4 หน่วย"], "ans": 1, "exp": "X เพิ่ม 2 หน่วย และ b = 0.7 ดังนั้น Y พยากรณ์เพิ่ม 0.7×2 = 1.4 หน่วย"}, {"id": 28, "type": "วิเคราะห์", "q": "ข้อมูลหนึ่งมี Y จริง = 4 และสมการพยากรณ์ให้ Ŷ = 3.4 ความคลาดเคลื่อน e = Y − Ŷ เท่ากั const KEY='stat_ch5_regression_quiz_v1';
const quiz=document.getElementById('quiz');
const result=document.getElementById('result');
let submitted=false;

function render(){
  quiz.innerHTML='';
  questions.forEach((x,i)=>{
    const card=document.createElement('section'); card.className='card'; card.id='q'+(i+1);
    const badge=document.createElement('span'); badge.className='badge '+(x.type==='จำ'?'memory':'analysis'); badge.textContent=x.type==='จำ'?'ช่วยจำ':'ช่วยวิเคราะห์/คำนวณ';
    const q=document.createElement('p'); q.className='q'; q.innerHTML=`ข้อ ${i+1}. ${x.q}`;
    card.append(badge,q);
    x.opts.forEach((op,j)=>{
      const label=document.createElement('label'); label.className='option';
      label.innerHTML=`<input type="radio" name="q${i}" value="${j}"> <span>${op}</span>`;
      card.appendChild(label);
    });
    const fb=document.createElement('div'); fb.className='feedback'; fb.id='fb'+i; card.appendChild(fb);
    quiz.appendChild(card);
  });
  load();
  updateProgress();
}
function getAnswers(){
  const a={};
  questions.forEach((_,i)=>{
    const el=document.querySelector(`input[name="q${i}"]:checked`);
    if(el) a[i]=Number(el.value);
  }); return a;
}
function save(){
  localStorage.setItem(KEY,JSON.stringify({answers:getAnswers(),submitted}));
  document.getElementById('saveStatus').textContent='บันทึกแล้ว ✓';
}
function load(){
  const raw=localStorage.getItem(KEY); if(!raw)return;
  try{
    const d=JSON.parse(raw);
    Object.entries(d.answers||{}).forEach(([i,v])=>{
      const el=document.querySelector(`input[name="q${i}"][value="${v}"]`); if(el)el.checked=true;
    });
    if(d.submitted){submitted=true; check(true);}
  }catch(e){}
}
function updateProgress(){
  const n=Object.keys(getAnswers()).length;
  document.getElementById('answered').textContent=`ตอบแล้ว ${n}/40`;
  document.getElementById('bar').style.width=(n/40*100)+'%';
}
document.addEventListener('change',()=>{if(!submitted){save();updateProgress();}});
function check(fromLoad=false){
  submitted=true;
  const a=getAnswers(); let score=0;
  questions.forEach((x,i)=>{
    const card=document.getElementById('q'+(i+1));
    const labels=card.querySelectorAll('.option');
    labels.forEach((lab,j)=>{lab.classList.remove('correct','wrong'); if(j===x.ans)lab.classList.add('correct');});
    const fb=document.getElementById('fb'+i);
    const chosen=a[i];
    if(chosen===x.ans){score++; fb.className='feedback show ok'; fb.innerHTML=`<b>✓ ถูกต้อง</b>${x.exp}`;}
    else{
      fb.className='feedback show no';
      const chosenText=(chosen===undefined)?'ยังไม่ได้ตอบ':x.opts[chosen];
      fb.innerHTML=`<b>✗ ${chosen===undefined?'ยังไม่ได้ตอบ':'ตอบผิด'}</b>คำตอบที่เลือก: ${chosenText}<br><b>ทำไมคำตอบนี้จึงผิด?</b>${chosen===undefined?'ข้อนี้ยังไม่มีคำตอบ จึงไม่ได้คะแนน':wrongReason(x,chosen)}<br><b>ทำไมข้อนี้ถึงถูก?</b>${x.exp}`;
      if(chosen!==undefined) labels[chosen].classList.add('wrong');
    }
  });
  const pct=(score/40*100).toFixed(1);
  result.className='result show';
  result.innerHTML=`<div>ผลการทำแบบทดสอบ</div><div class="score">${score}/40</div><div>${pct}%</div><p>${score>=32?'ดีมาก — พื้นฐานบทนี้แน่นแล้ว':score>=24?'ผ่านระดับหนึ่ง — ทบทวนข้อที่ผิดและสูตรคำนวณ': 'ควรทบทวนเรื่องสมการ, การทดสอบ และ r/r² อีกครั้ง'}</p><div class="small">คำตอบที่ถูกจะแสดงเป็นกรอบสีเขียว และคำตอบที่เลือกผิดเป็นสีแดง พร้อมเหตุผลใต้แต่ละข้อ</div>`;
  save();
  result.scrollIntoView({behavior:'smooth',block:'start'});
}
function wrongReason(x,chosen){
  const op=x.opts[chosen];
  if(x.id===1) return 'ข้อนี้สลับบทบาทของ X กับ Y; X คือข้อมูลตั้งต้น/ตัวแปรอิสระ ส่วน Y เป็นผลลัพธ์ที่ต้องการพยากรณ์';
  if(x.id===2) return 'คำตอบนี้ทำให้สองแนวคิดสลับหน้าที่กัน; Correlation เน้นความสัมพันธ์ ส่วน Regression ใช้สร้างสมการพยากรณ์ได้';
  if(x.id===3||x.id===4||x.id===5) return 'ตัวเลือกนี้ไม่ตรงกับองค์ประกอบของสมการ Ŷ = a + bX';
  if(x.id===6||x.id===7||x.id===30) return 'ให้พิจารณาเครื่องหมายและขนาดของ b เพราะ b เป็นความชันและบอกทิศทาง/อัตราการเปลี่ยนของ Y เมื่อ X เปลี่ยน';
  if(x.id===8||x.id===9||x.id===10) return 'ประเด็นสำคัญคือ Error = Y − Ŷ และ Least Squares ต้องทำให้ผลรวมกำลังสองของ Error ต่ำที่สุด';
  if(x.id>=11&&x.id<=16) return 'ข้อนี้เกี่ยวกับการตั้งสมมติฐาน/เกณฑ์การตัดสินใจ จึงต้องแยก H0, H1 และค่าทดสอบให้ตรงกับรูปแบบที่โจทย์ถาม';
  if(x.id>=17&&x.id<=20) return 'ข้อนี้ต้องแยกความหมายของ r, r² และสมมติฐานของ error ให้ชัดเจน';
  if(x.id>=21&&x.id<=29) return 'ข้อคำนวณนี้ต้องแทนค่าตามสมการหรือสูตรทีละขั้น อย่าใช้ค่าที่อยู่ในโจทย์สลับตำแหน่งกัน';
  if(x.id>=31&&x.id<=36) return 'ต้องเทียบค่า p หรือค่าสถิติทดสอบกับเกณฑ์ที่กำหนดก่อนสรุปผล';
  if(x.id>=37&&x.id<=40) return 'ต้องแยกทิศทาง/ขนาดของ r ออกจาก r² และแยกการวัดความสัมพันธ์ออกจากการพยากรณ์';
  return 'ตัวเลือกนี้ไม่ตรงกับหลักการที่โจทย์กำหนด';
}
